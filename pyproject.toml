[project]
name = "university-pz-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Maksim", email = "umerenkovmaksim7@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "apscheduler>=3.11,<4",
    "cryptg>=0.6.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "selectolax>=1.0.0",
    "sqlalchemy[asyncio]>=2.0",
    "telethon>=1.45.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
university-pz-parser = "university_pz_parser.__main__:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008", "E501", "SIM105", "SIM115", "ASYNC240"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
