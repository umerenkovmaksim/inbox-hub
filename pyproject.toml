[project]
name = "university-pz-parser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Maksim", email = "umerenkovmaksim7@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.9",
    "sqlalchemy>=2.1.2",
    "telethon>=1.45.0",
]

[project.scripts]
university-pz-parser = "university_pz_parser.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
