name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            mcp_adapter/uv.lock
      - name: Install server dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Test server
        run: uv run --locked pytest
      - name: Install MCP dependencies
        run: uv sync --locked --directory mcp_adapter
      - name: Test MCP adapter
        run: uv run --locked --directory mcp_adapter python -m pytest
