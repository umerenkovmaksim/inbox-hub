x-env: &env
  TELEGRAM__API_ID: ${TELEGRAM__API_ID:?}
  TELEGRAM__API_HASH: ${TELEGRAM__API_HASH:?}
  TELEGRAM__SOURCE_IDS: ${TELEGRAM__SOURCE_IDS:-[]}
  TELEGRAM__BACKFILL_FROM: ${TELEGRAM__BACKFILL_FROM:-2026-09-01T00:00:00+03:00}
  TELEGRAM__DEVICE_MODEL: ${TELEGRAM__DEVICE_MODEL:-Inbox Hub}
  TELEGRAM__SYSTEM_VERSION: ${TELEGRAM__SYSTEM_VERSION:-Linux}
  TELEGRAM__APP_VERSION: ${TELEGRAM__APP_VERSION:-1.0}
  TELEGRAM__RECONCILE_INTERVAL_HOURS: ${TELEGRAM__RECONCILE_INTERVAL_HOURS:-4}
  TELEGRAM__DOWNLOAD_KINDS: ${TELEGRAM__DOWNLOAD_KINDS:-["document","photo"]}
  SDO__URL: ${SDO__URL:-https://sdo.timacad.ru}
  SDO__USERNAME: ${SDO__USERNAME:?}
  SDO__PASSWORD: ${SDO__PASSWORD:?}
  SDO__EXCLUDE_COURSE_IDS: ${SDO__EXCLUDE_COURSE_IDS:-[]}
  SDO__BACKEND: ${SDO__BACKEND:-html}
  API__TOKEN: ${API__TOKEN:?}

services:
  # API + СДО. Applies migrations before serving, so "healthy" means the
  # database schema is current.
  inbox-hub:
    build: .
    command: ["sh", "-c", "inbox-hub init-db && exec inbox-hub serve"]
    restart: unless-stopped
    environment: *env
    volumes:
      - inbox-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  # The only process that talks to Telegram. Exactly one instance.
  collector:
    build: .
    command: ["inbox-hub", "collect"]
    restart: unless-stopped
    stop_grace_period: 60s
    environment: *env
    volumes:
      - inbox-data:/app/data
    depends_on:
      inbox-hub:
        condition: service_healthy

volumes:
  inbox-data:
    # Pinned so renaming the project directory keeps the existing data volume.
    name: university-pz-parser_inbox-data
