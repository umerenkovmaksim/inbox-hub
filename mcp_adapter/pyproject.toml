[project]
name = "study-inbox-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp>=2", "httpx>=0.27"]

[project.scripts]
study-inbox-mcp = "study_inbox_mcp.server:main"

[dependency-groups]
dev = ["pytest", "respx"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
