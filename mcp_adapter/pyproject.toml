[project]
name = "inbox-hub-mcp"
version = "0.1.0"
description = "MCP access to categorized Inbox Hub feeds"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["mcp>=2", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/umerenkovmaksim/inbox-hub"
Documentation = "https://github.com/umerenkovmaksim/inbox-hub/tree/main/mcp_adapter"
Issues = "https://github.com/umerenkovmaksim/inbox-hub/issues"

[project.scripts]
inbox-hub-mcp = "inbox_hub_mcp.server:main"

[dependency-groups]
dev = ["pytest", "respx"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
