# Categories, their channels, tracked chats, and key scopes.
# All IDs are fictional: replace them with your own. See docs/catalog.md.
# Copy to catalog.yaml, run `uv run inbox-hub catalog plan`, then `uv run inbox-hub catalog apply`.
# Without --prune, apply adds and updates; removals require --prune,
# except for explicit exclude and telegram.paused entries.

categories:
  study:
    title: Study
    description: Course materials and study chats
    auto_sources: [sdo]               # New LMS courses join automatically.
    channels:
      - telegram:-1009876543210       # Study chat; categorized chats are collected.
    exclude:
      - sdo:1234                      # Exclude an automatically included course.
  work:
    title: Work
    channels:
      - telegram:-1001234567890       # Work chat.

telegram:
  track: []    # Collect without categories; visible only to the admin.
  paused: []   # Stop collecting while preserving category membership.

keys:
  study-digest:
    categories: [study]   # The token is printed once when the key is created.
